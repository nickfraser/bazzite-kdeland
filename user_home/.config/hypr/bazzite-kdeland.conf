# Image integration for a KDE Plasma and Hyprland session.
# Source this file from ~/.config/hypr/hyprland.conf.

env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_MENU_PREFIX,plasma-

# Provide graphical authorization prompts for apps that use pkexec, such as
# Balena Etcher.
exec-once = systemctl --user start plasma-polkit-agent.service

# This session path does not activate graphical-session.target. Give systemd
# and D-Bus the Hyprland environment before restarting the portal service.
exec-once = sh -lc 'systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_MENU_PREFIX && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_MENU_PREFIX && systemctl --user reset-failed xdg-desktop-portal.service && systemctl --user restart xdg-desktop-portal.service'
