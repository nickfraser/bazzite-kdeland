[Service]
# This image targets a hybrid AMD iGPU + NVIDIA dGPU laptop where eDP-1 is on
# the AMD device (card1) and external outputs are on NVIDIA (card0). Keep both
# devices visible to the greeter, but prefer the AMD iGPU as the primary KWin
# render device to reduce cross-GPU cursor handoff issues.
Environment=KWIN_DRM_DEVICES=/dev/dri/card1:/dev/dri/card0
